name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Loyihani yaratish
        run: python3 make_apk.py
      - name: APK qurish
        working-directory: android
        env:
          RUN_NUM: ${{ github.run_number }}
          NG_KS_PASS: ${{ secrets.NG_KS_PASS }}
        run: gradle assembleDebug --no-daemon
      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NanoGram.apk
          gh release create "v1.0.${{ github.run_number }}" NanoGram.apk --title "NanoGram 1.0.${{ github.run_number }}" --notes "NanoGram APK"
